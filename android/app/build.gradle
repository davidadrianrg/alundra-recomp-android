plugins {
     id 'com.android.application'
}

def buildWithCMake = true
def gameRoot = projectDir.parentFile.parentFile
def generatedGameAssets = layout.buildDirectory.dir('generated/psxGameAssets')
// arm64 por defecto; -PpsxEmulator añade x86_64 para el emulador local.
def psxAbis = project.hasProperty('psxEmulator') ? ['arm64-v8a', 'x86_64'] : ['arm64-v8a']
// -PpsxHle: batching HLE del renderer GL (menos draw calls, menos exacto). A/B
// contra el LLE por defecto para medir FPS en el móvil.
def psxGlBatch = project.hasProperty('psxHle') ? 'HLE' : 'LLE'

// Firma estable: sin esto cada build usa la debug keystore del runner y Android
// rechaza la actualización ("firma inconsistente"). En CI llega por secrets
// (ANDROID_KEYSTORE_PATH / _PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD);
// en local, por esas mismas variables o ~/.hermes/keys/alundra-release.keystore.
def envKsPath = System.getenv("ANDROID_KEYSTORE_PATH")
def defaultKs = new File(System.getProperty("user.home"), ".hermes/keys/alundra-release.keystore")
def ksPath = envKsPath ?: (defaultKs.isFile() ? defaultKs.path : null)

android {
    namespace = "com.davidadrianrg.alundra"
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 15
        versionName "0.4.9"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static",
                          "-DPSX_GL_BATCH_IMPL=${psxGlBatch}"
                // Play build (gradle -PpsxPlayBuild): compile out the debug server
                // and per-block diagnostic hooks for speed.
                if (project.hasProperty('psxPlayBuild')) {
                    arguments "-DPSX_DEBUG_TOOLS=OFF"
                }
                abiFilters(*psxAbis)
            }
        }
    }
    signingConfigs {
        if (ksPath != null) {
            stable {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "alundra2026"
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "alundra"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: "alundra2026"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Keystore estable: las actualizaciones se instalan encima sin
            // desinstalar. La clave NO está en el repo (secrets de Actions).
            signingConfig ksPath != null ? signingConfigs.stable : signingConfigs.debug
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            if (buildWithCMake) {
                cmake {
                    path '../../CMakeLists.txt'
                    version "3.22.1"
                }
            } else {
                ndkBuild {
                    path 'jni/Android.mk'
                }
            }
        }

    }
    sourceSets.main.assets.srcDir(generatedGameAssets)
    // Shared psxrecomp Android code: start menu, game screen, on-screen pad.
    sourceSets.main.java.srcDir(new File(gameRoot, 'psxrecomp/runtime/android/java'))
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

tasks.register('stageGameAssets', Copy) {
    from(new File(gameRoot, 'psxrecomp/bios/openbios.bin')) {
        into 'bios'
    }
    from(new File(gameRoot, 'psxrecomp/bios/OpenBIOS.LICENSE')) {
        into 'bios'
    }
    into generatedGameAssets
}

// Ahead-of-time compiled overlay shards (captured on the phone, compiled with
// psxrecomp/tools/compile_overlays.py --target-os android). Shipped as assets
// and installed into the runtime's overlay cache on launch, so a fresh install
// runs overlay code natively without any play-time capture. Override the
// source with -PpsxOverlayCache=<dir containing cg*_gc*_f* dirs>.
// The game id (cache folder name) comes from this app's own game.toml.in.
def gameTomlIn = new File(projectDir, 'src/main/assets/game.toml.in').text
def gameIdMatch = gameTomlIn =~ /(?m)^id\s*=\s*"([^"]+)"/
def psxGameId = gameIdMatch.find() ? gameIdMatch.group(1) : 'UNKNOWN-GAME-ID'
def overlayCacheRoot = new File(project.findProperty('psxOverlayCache') ?:
        new File(gameRoot, "build-android-overlays/cache/${psxGameId}/gcc/linux-arm64").path)
def generatedOverlayAssets = layout.buildDirectory.dir('generated/psxGameOverlays')

tasks.register('stageGameOverlays', Sync) {
    def hashHeader = new File(gameRoot, 'psxrecomp/runtime/include/overlay_codegen_hash.h')
    // Optional: the header only exists once the framework's overlay codegen has
    // been baked. Without it there is nothing to match, so no shards ship.
    def m = hashHeader.isFile() ? hashHeader.text =~ /PSX_OVERLAY_CODEGEN_HASH\s+0x([0-9a-fA-F]+)u/ : null
    def codegen = (m && m.find()) ? m.group(1).toLowerCase().padLeft(8, '0') : null
    // Per-game quarantine: <game>/aot_exclude.txt lists RAM slots (shard prefixes such as
    // 0006C000) whose pre-compiled code must not ship; they stay on the interpreter.
    def excludeFile = new File(gameRoot, 'aot_exclude.txt')
    def excludedSlots = excludeFile.isFile() ?
            excludeFile.readLines().collect { it.replaceAll('#.*', '').trim() }.findAll { it } : []
    from(overlayCacheRoot) {
        include "cg*_${codegen}_gc*_f*/*.so"
        include "cg*_${codegen}_gc*_f*/*.ranges"
        excludedSlots.each { slot -> exclude "**/${slot}_*" }
        exclude '**/.*'
    }
    into generatedOverlayAssets.map { it.dir('overlays') }
    doLast {
        if (!overlayCacheRoot.isDirectory() || codegen == null)
            logger.warn("No AOT overlay cache bundled (looked in ${overlayCacheRoot})")
    }
}

android.sourceSets.main.assets.srcDir(generatedOverlayAssets)

tasks.named('preBuild').configure {
    dependsOn('stageGameAssets')
    dependsOn('stageGameOverlays')
}
