name: Release (Android APK)

# Publica el APK en Lanzamientos, y solo el APK.
#
# BYOC: el APK lleva dentro el programa del juego ya traducido, así que solo se
# puede construir donde exista `generated/` — es decir, en TU fork privado
# después de generarlo con tu disco:
#
#   tools/build.sh disc --disc <tu disco>     # crea generated/
#   git add -f generated && git commit && git push
#   git tag v0.1.0 && git push --tags
#
# En este repositorio público no hay `generated/`: el workflow termina en verde
# con un aviso y NO publica nada (no hay APK que publicar aquí).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (se crea si no existe)'
        required: true

permissions:
  contents: write

jobs:
  detect:
    name: ¿Hay generated/ en este checkout?
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.detect.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: detect
        run: |
          if compgen -G "generated/*_dispatch.c" > /dev/null; then
            echo "apk=true" >> "$GITHUB_OUTPUT"
            echo "generated/ presente: se construye el APK."
          else
            echo "apk=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=BYOC::Sin generated/ en este checkout. Nada que publicar: genera el tuyo con tools/build.sh disc en un fork privado."
          fi

  apk:
    name: Build APK (arm64) + Release
    needs: detect
    if: needs.detect.outputs.apk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK packages (platform 35, NDK 28.2, cmake 3.22.1)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
                     "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android && ./gradlew --no-daemon :app:assembleDebug -PpsxPlayBuild
      - name: Rename for the release
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "Alundra-android-arm64-${tag}.apk"
          ls -lh Alundra-android-arm64-*.apk
      - name: Publicar en Lanzamientos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Alundra Android ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            ## Alundra — Android (arm64)

            APK generado a partir de una copia propia del juego (BYOC). Contiene
            el programa recompilado, así que es **personal e intransferible**:
            no lo redistribuyas.

            **Instalar**: copia el `.apk` al móvil (o `adb install -r`) y abre la
            app → menú lateral → *Select game file* → tu `.cue`/`.bin` → **Play**.

            **Controles**: pad táctil (menú → *Controls* → `Touch pad: On/Off`,
            opacidad y disposición editables) y mandos Bluetooth/USB por SDL, que
            apartan el pad automáticamente.

            Uso no comercial (PolyForm Noncommercial 1.0.0).
          files: Alundra-android-arm64-*.apk
          fail_on_unmatched_files: true
