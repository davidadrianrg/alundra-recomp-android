name: Release

# Publishes the BYOC artifact: a setup host that generates the game from the
# player's own disc (no game code, no BIOS, no disc images in the asset).
#
# The APK is attached only when the ref being released already contains
# generated/ — that means a private fork built from your own copy, never this
# public repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (created if it does not exist)'
        required: true

permissions:
  contents: write

jobs:
  desktop-setup-host:
    name: Build setup host (linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev zlib1g-dev
      - name: Portable toolchain
        run: bash psxrecomp/tools/fetch_toolchain.sh --artifact linux-x64
      - name: Configure (no game C -> setup host)
        run: |
          . "${TOOLCHAIN_DIR:-$PWD/.cache/toolchain-pack}/env.sh"
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPSXRECOMP_ROOT="$PWD/psxrecomp" \
            -DPSX_RECOMP_UI=OFF -DPSX_REWIND=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON
      - name: Build
        run: |
          . "${TOOLCHAIN_DIR:-$PWD/.cache/toolchain-pack}/env.sh"
          cmake --build build-release -j"$(nproc)"
      - name: Stage and package
        run: |
          set -e
          stage="dist/AlundraRecomp-SetupHost-linux-x64"
          mkdir -p "$stage"
          cp build-release/psx-runtime "$stage/" 2>/dev/null || \
            cp build-release/AlundraRecomp "$stage/" 2>/dev/null || true
          for f in game.toml game_options.toml README.md LEEME_INSTRUCCIONES.txt; do
            [ -f "$f" ] && cp "$f" "$stage/" || true
          done
          [ -d build-release/mods ] && cp -r build-release/mods "$stage/" || true
          [ -d shaders ] && cp -r shaders "$stage/" || true
          ( cd dist && zip -qr "AlundraRecomp-SetupHost-linux-x64.zip" "$(basename "$stage")" )
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: setup-host-linux
          path: dist/*.zip
          if-no-files-found: error

  android-apk:
    name: Build APK (only with your own generated/ game C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Is the recompiled game C present?
        id: gamec
        run: |
          if compgen -G "generated/*_dispatch.c" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Public BYOC checkout: no generated/ -> no APK asset."
          fi
      - uses: actions/setup-java@v4
        if: steps.gamec.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.gamec.outputs.present == 'true'
      - name: SDK packages
        if: steps.gamec.outputs.present == 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
                     "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build APK
        if: steps.gamec.outputs.present == 'true'
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android && ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: steps.gamec.outputs.present == 'true'
        with:
          name: apk-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [desktop-setup-host]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Flatten assets
        run: |
          mkdir -p out
          find assets -type f \( -name '*.zip' -o -name '*.apk' \) -exec cp {} out/ \;
          ls -l out
      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            ## Bring your own copy (BYOC)

            These assets contain **no game code, no BIOS and no disc image**. The
            setup host asks for your own legal Alundra disc, generates the
            recompiled C on your machine with the bundled psxrecomp SDK, and
            builds the executable — everything happens locally.

            - **Setup host (PC)**: unzip, run it, pick your `.cue`/`.bin`.
            - **APK (if attached)**: built from the releaser's own copy; it is
              personal and non-transferable. Build your own with
              `tools/build.sh android --disc <your disc>`.

            Non-commercial use only (PolyForm Noncommercial 1.0.0).
          files: out/*
          fail_on_unmatched_files: true
