name: Release (Android APK)

# Publica el APK Android en Lanzamientos al empujar un tag v*.
# Mismo patron que el repo original: el codigo recompilado va versionado, el
# workflow compila el APK y lo adjunta al release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (se crea si no existe)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Build APK (arm64) + Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (el del runner) + paquetes que falten
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK" > android/local.properties
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -n "$SM" ] || { echo "no sdkmanager in $SDK"; exit 1; }
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0" \
                "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Keystore de release (firma estable)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew --no-daemon :app:assembleRelease
      - name: Rename for the release
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "Alundra-android-arm64-${tag}.apk"
          ls -lh Alundra-android-arm64-*.apk
      - name: Publicar en Lanzamientos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Alundra Android ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            ## Alundra — Android (arm64)

            APK nativo del port: recompilación estática del programa de PS1 a C,
            compilada para arm64. **No incluye** texturas, audio, FMV ni datos de
            nivel: la app lee todo eso de tu propia copia del juego, que le
            indicas al primer arranque.

            **Instalar**: copia el `.apk` al móvil (o `adb install -r`) y abre la
            app → menú lateral → *Select game file* → tu `.cue`/`.bin` → **Play**.

            **Controles**: pad táctil (menú → *Controls* → `Touch pad: On/Off`,
            opacidad y disposición editables) y mandos Bluetooth/USB por SDL, que
            apartan el pad automáticamente.

            **Requisitos**: Android 5+ (arm64), tu copia legal de Alundra
            (SLES-01258 u otra región soportada).

            Uso no comercial (PolyForm Noncommercial 1.0.0).
          files: Alundra-android-arm64-*.apk
          fail_on_unmatched_files: true
