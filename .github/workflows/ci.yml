name: CI

# Compila el APK Android en cada push a main y en cada PR, y lo deja como
# artefacto descargable. El codigo recompilado (generated/) esta versionado,
# igual que en el repo original, asi que no hace falta disco para compilar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (el del runner) + paquetes que falten
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK" > android/local.properties
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -n "$SM" ] || { echo "no sdkmanager in $SDK"; exit 1; }
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0" \
                "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build APK
        run: cd android && ./gradlew --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alundra-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
