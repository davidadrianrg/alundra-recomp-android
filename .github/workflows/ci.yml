name: CI

# Compila el APK Android en cada push a main y en cada PR, y lo deja como
# artefacto descargable. El codigo recompilado (generated/) esta versionado,
# igual que en el repo original, asi que no hace falta disco para compilar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK packages (platform 35, NDK 28.2, cmake 3.22.1)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
                     "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android && ./gradlew --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alundra-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
